<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Klub der Gesellschafts- und Brettspiele Ranking</title>
    <script type="module" src="/src/main.ts"></script>
  </head>

  <body>
    <div>
      <label>
        <input type="checkbox" id="united-we-stand" />
        von allen bewertet wurde
      </label>
    </div>

    <table>
      <thead>
        <tr>
          <td></td>
          <td>
            <div class="centered-buttons">
              <button id="button-reload-collection">Reload Collection</button>
            </div>
          </td>
          <td></td>
          <td></td>
          <td></td>
          <td>
            <div class="centered-buttons">
              <button id="button-reload-M__x">Reload M__x</button>
            </div>
          </td>
          <td class="centered-buttons">
            <div class="centered-buttons">
              <button id="button-reload-Mattreal">Reload Mattreal</button>
            </div>
          </td>
          <td>
            <div class="centered-buttons">
              <button id="button-reload-SeriousScribbler">
                Reload SeriousScribbler
              </button>
            </div>
          </td>
          <td>
            <div class="centered-buttons">
              <button id="button-reload-tibosaeinbein">
                Reload tibosaeinbein
              </button>
            </div>
          </td>
        </tr>
      </thead>

      <thead class="sticky-header">
        <tr>
          <th>Platz <button id="button-order-place" sort-key="rank" /></th>
          <th>
            Spiel <button id="button-order-game" sort-key="name" />
            <button>🗘</button>
          </th>
          <th>
            Ø <button id="button-order-average" sort-key="averageRating" />
          </th>
          <th>
            größte Abweichung
            <button
              id="button-order-difference"
              sort-key="greatestDifference"
            />
          </th>
          <th>
            Varianz
            <button id="button-order-variance" sort-key="standardDeviation" />
          </th>
          <th>
            M__x <button id="button-order-M__x" sort-key="ratings/M__x" />
          </th>
          <th>
            Mattreal
            <button id="button-order-Mattreal" sort-key="ratings/Mattreal" />
          </th>
          <th>
            SeriousScribbler
            <button
              id="button-order-SeriousScribbler"
              sort-key="ratings/SeriousScribbler"
            />
          </th>
          <th>
            tibosaeinbein
            <button
              id="button-order-tibosaeinbein"
              sort-key="ratings/tibosaeinbein"
            />
          </th>
        </tr>
      </thead>

      <tbody id="our-table-body"></tbody>

      <tfoot>
        <tr>
          <td></td>
          <td></td>
          <td id="cell-total-average-ranking" class="text-right">Ø 0</td>
          <td></td>
          <td></td>
          <td id="cell-average-user-ranking-M__x" class="text-right">Ø 0</td>
          <td id="cell-average-user-ranking-Mattreal" class="text-right">
            Ø 0
          </td>
          <td
            id="cell-average-user-ranking-SeriousScribbler"
            class="text-right"
          >
            Ø 0
          </td>
          <td id="cell-average-user-ranking-tibosaeinbein" class="text-right">
            Ø 0
          </td>
        </tr>
      </tfoot>
    </table>
  </body>
</html>
